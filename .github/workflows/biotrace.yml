# Dogfoods BioTrace against this repository itself, using the checked-out
# dist/index.js (`uses: ./`) rather than a published tag — this always works,
# even before the first release exists.
name: BioTrace (self-test)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
jobs:
  biotrace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: biotrace
        uses: ./
        with:
          config: .github/biotrace.yml
          github-token: ${{ github.token }}
          fail-on: error
          ai-enabled: "false"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biotrace-report
          path: ${{ steps.biotrace.outputs.report-path }}
